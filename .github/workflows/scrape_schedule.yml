name: Jadwal Scraper SJS

on:
  schedule:
    - cron: '20 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install selenium webdriver-manager beautifulsoup4 gspread oauth2client
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run scraper
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS }}
        run: python scraper_sjs.py
